<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link id="site-favicon" rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/141839719?s=64">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Azure Flare’s personal website. Profile and projects on GitHub.">
    <title>Home — Azure Flare</title>
    <link rel="stylesheet" href="./style.css?v=10">
    <!-- Translations load before the language and theme controls. -->
    <script src="./languages/en.js?v=10" defer>
    </script>
    <script src="./languages/ru.js?v=10" defer>
    </script>
    <script src="./languages/uk.js?v=10" defer>
    </script>
    <script src="./profile.js?v=10" defer></script>
    <script src="./main.js?v=10" defer>
    </script>
    <script src="./theme.js?v=10" defer>
    </script>
  </head>
  <body data-page="home">
    <header class="main-menu">
      <nav aria-label="Main navigation">
        <ul>
          <li>
            <a data-i18n="home" href="./?v=10" aria-current="page">Home</a>
          </li>
          <li><a data-i18n="blog" href="./blog/?v=10">Blog</a></li>
          <li>
            <a data-i18n="about" href="./about.html?v=10">About me</a>
          </li>
          <li>
            <a data-i18n="links" href="./links.html?v=10">Links</a>
          </li>
        </ul>
      </nav>
      <label class="language-control" hidden>
        <span data-i18n="language">Language</span>
        <select id="language-select">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="uk">Українська</option>
        </select>
      </label>
      <hr>
    </header>
    <main class="main-body">
      <section class="hero profile">
        <img class="profile-avatar" src="https://avatars.githubusercontent.com/u/141839719?v=4" alt="Azure Flare" width="144" height="144">
        <div class="profile-text">
          <code class="disable-link-styling">
            Azure Flare<br>
            <a href="https://github.com/azureflarez">@azureflarez</a><br>
            <a data-i18n="myGithub" href="https://github.com/azureflarez">My GitHub ↗</a><br>
            <a data-i18n="openRepo" href="https://github.com/azureflarez/site">Open repository →</a>
          </code>
        </div>
      </section>
      
    </main>
    <hr>
    <footer>
      <span>Azure Flare · <a href="https://github.com/azureflarez">GitHub</a>
      </span>
      <button type="button" id="theme-toggle" hidden>Light theme</button>
    </footer>
  </body>
</html>
